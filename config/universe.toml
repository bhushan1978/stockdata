# Which rows of the Dhan instrument master form the download universe.
# Values are matched case-insensitively against the master's columns.
# Run `python -m stockdata instruments summary --fetch` to see the real values first.
#
# Default: NSE cash equities, regular "EQ" series. To widen the universe later,
# add series (e.g. ["EQ", "BE", "SM"]) or point --universe-file at another file.
exchange_id = "NSE"
segment_code = "E"        # E = equity/cash segment
instrument = "EQUITY"
series = ["EQ"]
# Verified against the live compact master (2026-10-10): NSE|E|EQUITY|EQ holds 2,725 rows =
# 2,351 equity shares (ES) + 351 ETF + 22 "Other" (incl. NSE test symbols such as 11NSETEST) + 1 MF.
# Restricting to ES gives 2,351 rows with unique security ids and unique symbols.
instrument_types = ["ES"]
